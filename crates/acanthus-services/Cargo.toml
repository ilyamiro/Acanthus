[package]
name = "acanthus-services"
description = "System integration services (D-Bus, compositor IPC, system info) exposed as reactive signals"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
acanthus-core.workspace = true
acanthus-io.workspace = true
calloop.workspace = true
zbus.workspace = true
futures-lite.workspace = true
async-channel.workspace = true
async-io.workspace = true
async-executor.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
chrono.workspace = true
pipewire = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true }
calloop-wayland-source = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[features]
default = [
    "pipewire",
    "pam",
    "polkit",
    "bluetooth",
    "brightness",
    "file-chooser",
    "gamma",
    "idle",
    "mpris",
    "network",
    "notifications",
    "portal-settings",
    "power-profiles",
    "screensaver",
    "shortcuts",
    "toplevels",
    "tray",
    "upower",
]
pipewire = ["dep:pipewire"]
pam = ["dep:libloading"]
polkit = []
bluetooth = []
brightness = []
file-chooser = []
gamma = ["wayland", "dep:wayland-protocols-wlr"]
idle = ["wayland", "dep:wayland-protocols"]
mpris = []
network = []
notifications = []
portal-settings = []
power-profiles = []
screensaver = []
shortcuts = []
toplevels = ["wayland", "dep:wayland-protocols-wlr"]
tray = []
upower = []
wayland = ["dep:wayland-client", "dep:calloop-wayland-source"]
testing = []

[dev-dependencies]
tempfile.workspace = true
